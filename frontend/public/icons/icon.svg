<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#1e293b" stroke-width="8" />
  
  <!-- Candlestick 1 -->
  <line x1="120" y1="180" x2="120" y2="380" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
  <rect x="96" y="220" width="48" height="120" rx="8" fill="url(#primaryGrad)" />
  
  <!-- Candlestick 2 -->
  <line x1="210" y1="140" x2="210" y2="340" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <rect x="186" y="180" width="48" height="100" rx="8" fill="url(#accentGrad)" />

  <!-- Candlestick 3 (Whale/Breakout) -->
  <line x1="300" y1="90" x2="300" y2="330" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
  <rect x="276" y="120" width="48" height="160" rx="8" fill="url(#primaryGrad)" />

  <!-- Candlestick 4 -->
  <line x1="390" y1="60" x2="390" y2="280" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" />
  <rect x="366" y="80" width="48" height="130" rx="8" fill="url(#goldGrad)" />

  <!-- Rising Dynamic Trend Wave -->
  <path d="M 80 360 Q 200 300, 290 220 T 440 100" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" />
  <circle cx="440" cy="100" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="4" />
</svg>
